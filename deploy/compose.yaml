# Personal Brain V1 LAN deployment layout.
# Publish only the owner-approved 192.168.10.7:18081 endpoint.
# Secrets must be mounted from files, never embedded here.
name: personal-brain-v1

services:
  model-proxy:
    image: personal-brain-v1-runtime:local
    command: ["python", "-m", "personal_brain_server.model_proxy"]
    network_mode: host
    environment:
      BRAIN_MODEL_PROXY_SOCKET: /run/model-proxy/ark.sock
    volumes:
      - /home/kms/personal-brain-v1-data/model-proxy:/run/model-proxy
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/model-proxy/ark.sock"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: brain
      POSTGRES_DB: brain
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - brain-db:/var/lib/postgresql/data
    secrets: [db_password]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
    restart: unless-stopped

  migrate:
    image: personal-brain-v1-runtime:local
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      BRAIN_DATABASE_DSN_FILE: /run/secrets/db_dsn
    secrets: [db_dsn]
    networks: [internal]
    restart: "no"

  api:
    image: personal-brain-v1-runtime:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      # The target host intentionally has no route from Docker's default build
      # network, while host-network HTTPS is available.  This applies only to
      # the trusted image build; runtime services remain on `internal`.
      network: host
    command: ["python", "-m", "personal_brain_server"]
    ports:
      - "192.168.10.7:18081:18081"
    depends_on:
      migrate:
        condition: service_completed_successfully
      model-proxy:
        condition: service_healthy
    environment:
      BRAIN_ENVIRONMENT: production
      BRAIN_BIND_HOST: 0.0.0.0
      BRAIN_PUBLISHED_HOST: 192.168.10.7
      BRAIN_CONTAINERIZED: "true"
      BRAIN_BIND_PORT: 18081
      BRAIN_DATA_ROOT: /srv/brain/data
      BRAIN_DATABASE_DSN_FILE: /run/secrets/db_dsn
      BRAIN_TOKEN_PEPPER_FILE: /run/secrets/token_pepper
      BRAIN_EXTERNAL_MODELS_ENABLED: "true"
      BRAIN_MODEL_API_KEY_FILE: /run/secrets/model_api_key
      BRAIN_CHAT_MODEL_BASE_URL: https://ark.cn-beijing.volces.com/api/coding
      BRAIN_CHAT_MODEL_NAME: deepseek-v4.1-flash
      BRAIN_EMBEDDING_BASE_URL: https://ark.cn-beijing.volces.com/api/coding/v3
      BRAIN_EMBEDDING_MODEL_NAME: doubao-embedding-vision
      BRAIN_EMBEDDING_DIMENSIONS: "1024"
      BRAIN_MODEL_PROXY_SOCKET: /run/model-proxy/ark.sock
    volumes:
      - brain-data:/srv/brain/data
      - /home/kms/personal-brain-v1-data/model-proxy:/run/model-proxy
    secrets: [db_dsn, token_pepper, model_api_key]
    networks: [internal]
    restart: unless-stopped

  worker:
    image: personal-brain-v1-runtime:local
    command: ["python", "-m", "personal_brain_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      model-proxy:
        condition: service_healthy
    secrets: [db_dsn, token_pepper, model_api_key]
    environment:
      BRAIN_ENVIRONMENT: production
      BRAIN_BIND_HOST: 0.0.0.0
      BRAIN_PUBLISHED_HOST: 192.168.10.7
      BRAIN_CONTAINERIZED: "true"
      BRAIN_DATA_ROOT: /srv/brain/data
      BRAIN_DATABASE_DSN_FILE: /run/secrets/db_dsn
      BRAIN_TOKEN_PEPPER_FILE: /run/secrets/token_pepper
      BRAIN_EXTERNAL_MODELS_ENABLED: "true"
      BRAIN_MODEL_API_KEY_FILE: /run/secrets/model_api_key
      BRAIN_CHAT_MODEL_BASE_URL: https://ark.cn-beijing.volces.com/api/coding
      BRAIN_CHAT_MODEL_NAME: deepseek-v4.1-flash
      BRAIN_EMBEDDING_BASE_URL: https://ark.cn-beijing.volces.com/api/coding/v3
      BRAIN_EMBEDDING_MODEL_NAME: doubao-embedding-vision
      BRAIN_EMBEDDING_DIMENSIONS: "1024"
      BRAIN_MODEL_PROXY_SOCKET: /run/model-proxy/ark.sock
    volumes:
      - brain-data:/srv/brain/data
      - /home/kms/personal-brain-v1-data/model-proxy:/run/model-proxy
    networks: [internal]
    restart: unless-stopped

volumes:
  brain-db: {}
  brain-data: {}

networks:
  internal: {}

secrets:
  db_password:
    file: ${BRAIN_DB_PASSWORD_FILE:?set BRAIN_DB_PASSWORD_FILE}
  db_dsn:
    file: ${BRAIN_DB_DSN_FILE:?set BRAIN_DB_DSN_FILE}
  token_pepper:
    file: ${BRAIN_TOKEN_PEPPER_FILE:?set BRAIN_TOKEN_PEPPER_FILE}
  model_api_key:
    file: ${BRAIN_MODEL_API_KEY_FILE:?set BRAIN_MODEL_API_KEY_FILE}
